{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ church.name }} · Harpr Church{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/harpr.css' %}">
    <script>
        (function () {
            var theme = localStorage.getItem("harpr-theme") ||
                (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
</head>

<body class="public-body">
    <header class="public-topbar">
        <a class="public-topbar-brand" href="{% url 'home' %}">
            <span class="brand-mark" aria-hidden="true">H</span>
            <span><strong>Harpr</strong></span>
        </a>
        <nav class="public-topbar-actions">
            <a href="{% url 'home' %}">Home</a>
            {% if user.is_authenticated %}
            <a href="{% url 'admin_dashboard' %}">Dashboard</a>
            {% else %}
            <a href="{% url 'login' %}">Sign in</a>
            {% endif %}
            <button type="button" class="icon-btn" id="theme-toggle" aria-label="Toggle theme">◐</button>
        </nav>
    </header>

    <main class="public-shell">
        <header class="public-head">
            <div>
                <p class="eyebrow">Harpr Church</p>
                <h1>{{ church.name }}</h1>
            </div>
            <button class="btn btn-ghost" data-save-church data-slug="{{ church.slug }}">Save this church</button>
        </header>
        {% block content %}{% endblock %}
    </main>

    <script>
        (function () {
            var toggle = document.getElementById("theme-toggle");
            if (toggle) toggle.addEventListener("click", function () {
                var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
                document.documentElement.setAttribute("data-theme", next);
                localStorage.setItem("harpr-theme", next);
            });
        })();
    </script>

    {% block scripts %}
    <script>
        (function () {
            var btn = document.querySelector("[data-save-church]");
            if (!btn) return;
            var churchSlug = btn.dataset.slug;
            var churchName = "{{ church.name|escapejs }}";
            try {
                var saved = JSON.parse(localStorage.getItem("harpr-saved-churches") || "[]");
                if (saved.some(function (c) { return c.slug === churchSlug; })) {
                    btn.textContent = "Saved";
                    btn.disabled = true;
                }
            } catch (e) { }
            btn.addEventListener("click", function () {
                try {
                    var saved = JSON.parse(localStorage.getItem("harpr-saved-churches") || "[]");
                    if (!saved.some(function (c) { return c.slug === churchSlug; })) {
                        saved.push({ slug: churchSlug, name: churchName });
                        localStorage.setItem("harpr-saved-churches", JSON.stringify(saved));
                    }
                } catch (e) { }
                this.textContent = "Saved";
                this.disabled = true;
            });
        })();
    </script>
    {% endblock %}
</body>

</html>
