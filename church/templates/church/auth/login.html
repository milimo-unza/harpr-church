{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Harpr Church</title>
  <link rel="stylesheet" href="{% static 'css/cosmos.css' %}">
</head>
<body>
  <main style="max-width: 420px; margin: 12vh auto; padding: 2rem;">
    <p class="mono" style="color: var(--muted-fg);">Harpr Church</p>
    <h1>Sign in</h1>
    {% if form.errors %}
      <p role="alert">Please check your username and password.</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <p>
        <label for="{{ form.username.id_for_label }}">Username</label>
        {{ form.username }}
      </p>
      <p>
        <label for="{{ form.password.id_for_label }}">Password</label>
        {{ form.password }}
      </p>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
