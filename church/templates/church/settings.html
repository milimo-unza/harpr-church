{% extends "church/base.html" %}
{% block title %}Settings · Harpr Church{% endblock %}
{% block content %}<div class="narrow-page"><p class="eyebrow">Church profile</p><h1>Settings</h1><div class="card form-card"><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">Save settings</button></form></div><div class="card qr-display"><h2>Public schedule QR</h2><img src="{% url 'church_qr' church.slug %}" alt="QR code for public schedule"><p class="muted">Timezone defaults to Africa/Lusaka.</p></div></div>{% endblock %}
