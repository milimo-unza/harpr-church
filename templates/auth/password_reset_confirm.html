{% load static %}
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Set a new password · Harpr</title>
    <link rel="stylesheet" href="{% static 'css/harpr.css' %}">
</head>

<body class="auth-body">
    <main class="auth-card">
        <h1>Set a new password</h1>
        {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary btn-block" type="submit">Save new password</button>
        </form>
        {% else %}
        <p class="form-error">This reset link is invalid or has already been used.</p>
        <p><a class="btn btn-primary btn-block" href="{% url 'password_reset' %}">Request a new link</a></p>
        {% endif %}
    </main>
</body>

</html>
