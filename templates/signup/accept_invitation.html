{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accept invitation · Harpr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/harpr.css' %}">
</head>
<body class="auth-body">
  <main class="auth-card">
    <h1>Join {{ invitation.church.name }}</h1>
    <p class="muted">You were invited as a {{ invitation.get_role_display }}{% if invitation.department %} for {{ invitation.department.name }}{% endif %}.</p>
    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="form-row"><label for="first_name">First name</label><input name="first_name" id="first_name"></div>
      <div class="form-row"><label for="last_name">Last name</label><input name="last_name" id="last_name"></div>
      <div class="form-row"><label for="username">Username</label><input name="username" id="username" required></div>
      <div class="form-row"><label for="password1">Password</label><input type="password" name="password1" id="password1" required></div>
      <div class="form-row"><label for="password2">Confirm password</label><input type="password" name="password2" id="password2" required></div>
      <button class="btn btn-primary btn-block" type="submit">Accept and set password</button>
    </form>
  </main>
</body></html>
